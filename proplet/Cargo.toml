[package]
name = "proplet"
version = "0.6.2"
edition = "2021"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
rumqttc = "0.25.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
wasmtime = { version = "49.0.1", features = ["component-model", "async", "wave"] }
wasmtime-wasi = "49.0.1"
wasmtime-wasi-http = "49.0.1"
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
which = "8.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.33", features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
] }
prometheus = "0.14"
http-body = "1"
http-body-util = "0.1"
config = "0.15.26"
async-trait = "0.1"
base64 = "0.23.1"
url = "2.5"
sysinfo = "0.39.6"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }

# TEE & Encryption Support (default feature)
attestation-agent = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads", default-features = false, features = [
  "rust-crypto",
  "kbs",
] }
image-rs = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads", default-features = false, features = [
  "encryption-ring",
  "keywrap-grpc",
  "oci-client-rustls",
  "signature-cosign-rustls",
  "futures",
] }
kbs_protocol = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads", features = [
  "background_check",
  "rust-crypto",
], default-features = false }
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
oci-spec = { version = "0.10.0" }
resource_uri = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads" }
hex = { version = "0.4" }
futures-util = { version = "0.3" }

# ELASTIC TEE HAL — hardware abstraction layer for TEE workloads.
# The `amd-sev` feature is enabled per-target below (x86_64 only).
elastic-tee-hal = { git = "https://github.com/elasticproject-eu/wasmhal", branch = "main", default-features = false }
wasm-wave = "0.258.0"

# ELASTIC WasmHAL-Hardware: wasi-usb
wasmtime-wasi-usb = "48.0.0"

# ELASTIC - Dependency for loading external WASI security providers (as a shared library), e.g. THS WASI PEP library.
dlopen2 = "0.9"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.53", features = ["full"] }

[features]
default = []

[profile.release]
strip = "symbols"

# ELASTIC - The wasi_security structures are used by external WASI security providers, e.g. THS WASI PEP library.
# TODO: make wasi_security.rs a separate library crate
[lib]
path = "src/wasi_security.rs"
crate-type = ["lib"]

# Azure SEV-SNP attestation via the vTPM, x86_64 only. SEV-SNP and TDX are
# x86_64-only technologies, and `tss-esapi-sys` (pulled in by az-snp-vtpm)
# neither supports riscv64 nor cross-compiles without a target sysroot, so
# these features must not be enabled unconditionally — the arm64/riscv64
# proplet builds would fail.
[target.'cfg(target_arch = "x86_64")'.dependencies]
attestation-agent = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads", default-features = false, features = [
  "rust-crypto",
  "kbs",
  "az-snp-vtpm-attester",
] }
kbs_protocol = { git = "https://github.com/rodneyosodo/guest-components", branch = "enable-wasm-workloads", features = [
  "background_check",
  "rust-crypto",
  "az-snp-vtpm-attester",
], default-features = false }
elastic-tee-hal = { git = "https://github.com/elasticproject-eu/wasmhal", branch = "main", default-features = false, features = [
  "amd-sev",
] }
