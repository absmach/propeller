name: "propeller"

networks:
  propeller-base-net:
    external: true
    name: propeller-base-net

volumes:
  propeller-proplet-tls-volume:

services:
  manager:
    image: ghcr.io/absmach/propeller/manager:${PROP_RELEASE_TAG}
    pull_policy: always
    container_name: propeller-manager
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://localhost:${MANAGER_HTTP_PORT}/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    expose:
      - ${MANAGER_HTTP_PORT}
    ports:
      - ${MANAGER_HTTP_PORT}:${MANAGER_HTTP_PORT}
    environment:
      MANAGER_LOG_LEVEL: ${MANAGER_LOG_LEVEL}
      MANAGER_INSTANCE_ID: ${MANAGER_INSTANCE_ID}
      MANAGER_MQTT_ADDRESS: ${MANAGER_MQTT_ADDRESS}
      MANAGER_MQTT_QOS: ${MANAGER_MQTT_QOS}
      MANAGER_MQTT_TIMEOUT: ${MANAGER_MQTT_TIMEOUT}
      MANAGER_TENANT_ID: ${MANAGER_TENANT_ID}
      MANAGER_CHANNEL_ID: ${MANAGER_CHANNEL_ID}
      MANAGER_ENTITY_ID: ${MANAGER_ENTITY_ID}
      MANAGER_API_KEY: ${MANAGER_API_KEY}
      MANAGER_HTTP_HOST: ${MANAGER_HTTP_HOST}
      MANAGER_HTTP_PORT: ${MANAGER_HTTP_PORT}
      MANAGER_HTTP_SERVER_CERT: ${MANAGER_HTTP_SERVER_CERT}
      MANAGER_HTTP_SERVER_KEY: ${MANAGER_HTTP_SERVER_KEY}
      MANAGER_OTEL_URL: ${MANAGER_OTEL_URL}
      MANAGER_TRACE_RATIO: ${MANAGER_TRACE_RATIO}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE}
      MANAGER_STORAGE_TYPE: ${MANAGER_STORAGE_TYPE:-badger}
      MANAGER_BADGER_PATH: ${MANAGER_BADGER_PATH:-/tmp/badger}
      MANAGER_SQLITE_PATH: ${MANAGER_SQLITE_PATH:-/tmp/propeller.db}
      MANAGER_POSTGRES_HOST: ${MANAGER_POSTGRES_HOST:-localhost}
      MANAGER_POSTGRES_PORT: ${MANAGER_POSTGRES_PORT:-5432}
      MANAGER_POSTGRES_USER: ${MANAGER_POSTGRES_USER:-propeller}
      MANAGER_POSTGRES_PASS: ${MANAGER_POSTGRES_PASS:-propeller}
      MANAGER_POSTGRES_DB: ${MANAGER_POSTGRES_DB:-propeller}
      MANAGER_POSTGRES_SSLMODE: ${MANAGER_POSTGRES_SSLMODE:-disable}
      MANAGER_MQTT_TLS_CA_CERT: ${MANAGER_MQTT_TLS_CA_CERT}
      MANAGER_MQTT_TLS_CLIENT_CERT: ${MANAGER_MQTT_TLS_CLIENT_CERT}
      MANAGER_MQTT_TLS_CLIENT_KEY: ${MANAGER_MQTT_TLS_CLIENT_KEY}
      MANAGER_MQTT_TLS_INSECURE_SKIP_VERIFY: ${MANAGER_MQTT_TLS_INSECURE_SKIP_VERIFY}
    volumes:
      - type: bind
        source: ../config.toml
        target: /config.toml
        bind:
          create_host_path: false
      - type: bind
        source: ./ssl/certs/ca.crt
        target: /etc/propeller/tls/ca.crt
        read_only: true
      - type: bind
        source: ./ssl/certs/manager.crt
        target: /etc/propeller/tls/client.crt
        read_only: true
      - type: bind
        source: ./ssl/certs/manager.key
        target: /etc/propeller/tls/client.key
        read_only: true
    networks:
      - propeller-base-net

  # Stage the Proplet client key in a private volume owned by the non-root
  # Proplet user. Bind-mounted host keys remain mode 0600.
  proplet-tls-init:
    image: ${PROPLET_IMAGE}:${PROPLET_IMAGE_TAG}
    pull_policy: always
    container_name: propeller-proplet-tls-init
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        proplet_uid=$$(id -u proplet)
        proplet_gid=$$(id -g proplet)
        install -d -o "$${proplet_uid}" -g "$${proplet_gid}" -m 0700 /target
        install -o "$${proplet_uid}" -g "$${proplet_gid}" -m 0444 /source/ca.crt /target/ca.crt
        install -o "$${proplet_uid}" -g "$${proplet_gid}" -m 0444 /source/client.crt /target/client.crt
        install -o "$${proplet_uid}" -g "$${proplet_gid}" -m 0400 /source/client.key /target/client.key
    volumes:
      - type: bind
        source: ./ssl/certs/ca.crt
        target: /source/ca.crt
        read_only: true
      - type: bind
        source: ./ssl/certs/proplet.crt
        target: /source/client.crt
        read_only: true
      - type: bind
        source: ./ssl/certs/proplet.key
        target: /source/client.key
        read_only: true
      - type: volume
        source: propeller-proplet-tls-volume
        target: /target
        volume:
          nocopy: true
    restart: "no"

  # Proplet - WebAssembly edge runtime
  # Available images:
  #   - ghcr.io/absmach/propeller/proplet:latest         (base, lightweight)
  #   - ghcr.io/absmach/propeller/proplet-wasi-nn:latest (with wasi-nn/OpenVINO, x86_64 only)
  #
  # For wasi-nn support, set in .env:
  #   1. PROPLET_IMAGE=ghcr.io/absmach/propeller/proplet-wasi-nn
  #   2. PROPLET_IMAGE_TAG=latest
  #   3. PROPLET_EXTERNAL_WASM_RUNTIME=wasmtime
  proplet:
    image: ${PROPLET_IMAGE}:${PROPLET_IMAGE_TAG}
    pull_policy: always
    container_name: propeller-proplet
    restart: on-failure
    depends_on:
      proplet-tls-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:${PROPLET_METRICS_PORT}/health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - ${PROPLET_METRICS_PORT}:${PROPLET_METRICS_PORT}
    environment:
      PROPLET_LOG_LEVEL: ${PROPLET_LOG_LEVEL}
      PROPLET_INSTANCE_ID: ${PROPLET_INSTANCE_ID}
      PROPLET_MQTT_ADDRESS: ${PROPLET_MQTT_ADDRESS}
      PROPLET_MQTT_QOS: ${PROPLET_MQTT_QOS}
      PROPLET_MQTT_TIMEOUT: ${PROPLET_MQTT_TIMEOUT}
      PROPLET_LIVELINESS_INTERVAL: ${PROPLET_LIVELINESS_INTERVAL}
      PROPLET_TENANT_ID: ${PROPLET_TENANT_ID}
      PROPLET_CHANNEL_ID: ${PROPLET_CHANNEL_ID}
      PROPLET_ENTITY_ID: ${PROPLET_ENTITY_ID}
      PROPLET_API_KEY: ${PROPLET_API_KEY}
      PROPLET_HAL_ENABLED: ${PROPLET_HAL_ENABLED}
      PROPLET_HTTP_ENABLED: ${PROPLET_HTTP_ENABLED}
      PROPLET_EXTERNAL_WASM_RUNTIME: ${PROPLET_EXTERNAL_WASM_RUNTIME}
      PROPLET_METRICS_PORT: ${PROPLET_METRICS_PORT}
      PROPLET_METRICS_ENABLED: ${PROPLET_METRICS_ENABLED:-true}
      PROPLET_OTEL_URL: ${PROPLET_OTEL_URL}
      PROPLET_TRACE_RATIO: ${PROPLET_TRACE_RATIO}
      PROPLET_MANAGER_K8S_NAMESPACE: ${PROPLET_MANAGER_K8S_NAMESPACE}
      PROPLET_CONFIG_FILE: ${PROPLET_CONFIG_FILE}
      PROPLET_CONFIG_SECTION: ${PROPLET_CONFIG_SECTION}
      MANAGER_COORDINATOR_URL: ${MANAGER_COORDINATOR_URL:-http://coordinator-http:8080}
      MODEL_REGISTRY_URL: ${MODEL_REGISTRY_URL:-http://model-registry:8081}
      DATA_STORE_URL: ${DATA_STORE_URL:-http://local-data-store:8083}
      PROPLET_MQTT_TLS_CA_CERT: ${PROPLET_MQTT_TLS_CA_CERT}
      PROPLET_MQTT_TLS_CLIENT_CERT: ${PROPLET_MQTT_TLS_CLIENT_CERT}
      PROPLET_MQTT_TLS_CLIENT_KEY: ${PROPLET_MQTT_TLS_CLIENT_KEY}
      PROPLET_MQTT_TLS_INSECURE_SKIP_VERIFY: ${PROPLET_MQTT_TLS_INSECURE_SKIP_VERIFY}
      # Outgoing HTTP TLS — uncomment to trust custom/self-signed CA certificates
      # for HTTPS requests made by WASM workloads and proplet itself.
      # PROPLET_HTTP_TLS_CA_CERT: ${PROPLET_HTTP_TLS_CA_CERT}
      # PROPLET_HTTP_TLS_INSECURE_SKIP_VERIFY: ${PROPLET_HTTP_TLS_INSECURE_SKIP_VERIFY}
    volumes:
      - type: bind
        source: ../config.toml
        target: /home/proplet/config.toml
        bind:
          create_host_path: false
      - type: volume
        source: propeller-proplet-tls-volume
        target: /etc/propeller/tls
        read_only: true
        volume:
          nocopy: true
      # HTTP TLS CA cert (uncomment to trust custom CAs for outgoing HTTPS):
      # - type: bind
      #   source: ./ca.crt
      #   target: /etc/propeller/tls/http-ca.crt
      #   read_only: true
      # To run wasi-nn examples, uncomment the fixture volume and create the directory with model files.
      # See examples/wasi-nn/README.md for setup instructions.
      # - ../fixture:/home/proplet/fixture
    # Uncomment for wasi-nn image (OpenVINO requires x86_64)
    # platform: linux/amd64
    networks:
      - propeller-base-net

  proxy:
    image: ghcr.io/absmach/propeller/proxy:${PROP_RELEASE_TAG}
    pull_policy: always
    container_name: propeller-proxy
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://localhost:${PROXY_HTTP_PORT}/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    expose:
      - ${PROXY_HTTP_PORT}
    ports:
      - ${PROXY_HTTP_PORT}:${PROXY_HTTP_PORT}
    environment:
      PROXY_LOG_LEVEL: ${PROXY_LOG_LEVEL}
      PROXY_INSTANCE_ID: ${PROXY_INSTANCE_ID}
      PROXY_MQTT_ADDRESS: ${PROXY_MQTT_ADDRESS:-tcp://nginx:1883}
      PROXY_MQTT_QOS: ${PROXY_MQTT_QOS}
      PROXY_MQTT_TIMEOUT: ${PROXY_MQTT_TIMEOUT}
      PROXY_TENANT_ID: ${PROXY_TENANT_ID}
      PROXY_CHANNEL_ID: ${PROXY_CHANNEL_ID}
      PROXY_ENTITY_ID: ${PROXY_ENTITY_ID}
      PROXY_API_KEY: ${PROXY_API_KEY}
      PROXY_CHUNK_SIZE: ${PROXY_CHUNK_SIZE}
      PROXY_AUTHENTICATE: ${PROXY_AUTHENTICATE}
      PROXY_REGISTRY_TOKEN: ${PROXY_REGISTRY_TOKEN}
      PROXY_REGISTRY_USERNAME: ${PROXY_REGISTRY_USERNAME}
      PROXY_REGISTRY_PASSWORD: ${PROXY_REGISTRY_PASSWORD}
      PROXY_REGISTRY_URL: ${PROXY_REGISTRY_URL}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT}
      PROXY_OTEL_URL: ${PROXY_OTEL_URL}
      PROXY_TRACE_RATIO: ${PROXY_TRACE_RATIO}
      # MQTT over TLS / mTLS — uncomment to enable.
      # Then also mount cert files (see volumes section below).
      # PROXY_MQTT_TLS_CA_CERT: ${PROXY_MQTT_TLS_CA_CERT}
      # PROXY_MQTT_TLS_CLIENT_CERT: ${PROXY_MQTT_TLS_CLIENT_CERT}
      # PROXY_MQTT_TLS_CLIENT_KEY: ${PROXY_MQTT_TLS_CLIENT_KEY}
      # PROXY_MQTT_TLS_INSECURE_SKIP_VERIFY: ${PROXY_MQTT_TLS_INSECURE_SKIP_VERIFY}
    volumes:
      - type: bind
        source: ../config.toml
        target: /config.toml
        bind:
          create_host_path: false
      # MQTT TLS certs (uncomment and change source paths when using ssl://):
      # - type: bind
      #   source: ./ssl/certs/ca.crt
      #   target: /etc/propeller/tls/ca.crt
      #   read_only: true
      # - type: bind
      #   source: ./ssl/certs/proxy.crt
      #   target: /etc/propeller/tls/client.crt
      #   read_only: true
      # - type: bind
      #   source: ./ssl/certs/proxy.key
      #   target: /etc/propeller/tls/client.key
      #   read_only: true
    networks:
      - propeller-base-net
