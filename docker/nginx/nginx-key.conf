# Propeller NGINX configuration — Atom + FluxMQ stack.

user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    # Explanation: https://serverfault.com/questions/787919/optimal-value-for-nginx-worker-connections
    # We'll keep 10k connections per core (assuming one worker per core)
    worker_connections 10000;
}

http {
    include snippets/http_access_log.conf;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # Include single-node or multiple-node (cluster) upstream
    include snippets/mqtt-ws-upstream.conf;
    include snippets/fluxmq-http-upstream.conf;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        set $dynamic_server_name "$MG_NGINX_SERVER_NAME";

        if ($dynamic_server_name = '') {
            set $dynamic_server_name "localhost";
        }

        server_name $dynamic_server_name;
        set $atom_upstream "atom:${ATOM_HTTP_PORT}";

        include snippets/ssl.conf;

        add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Methods '*';
        add_header Access-Control-Allow-Headers '*';

        # Proxy pass to Atom (identity, auth, GraphQL)
        location / {
            include snippets/proxy-headers.conf;
            proxy_pass http://$atom_upstream;
        }

        # Proxy pass to FluxMQ HTTP API (HTTP-MQTT bridge)
        location /http/ {
            include snippets/proxy-headers.conf;
            proxy_pass http://fluxmq_http_cluster/;
        }

        # Proxy pass to FluxMQ MQTT over WebSocket
        location /mqtt {
            include snippets/proxy-headers.conf;
            include snippets/ws-upgrade.conf;
            proxy_pass http://mqtt_ws_cluster;
        }
    }
}

# MQTT
stream {
   include snippets/stream_access_log.conf;

    # Include single-node or multiple-node (cluster) upstream
    include snippets/mqtt-upstream.conf;
    include snippets/mqtt-mtls-upstream.conf;
    include snippets/mqtt-v5-upstream.conf;
    include snippets/fluxmq-amqp-upstream.conf;

    # Plain MQTT remains a normal TCP proxy to FluxMQ's plaintext listener.
    server {
        listen ${MG_NGINX_MQTT_PORT};
        listen [::]:${MG_NGINX_MQTT_PORT};

        proxy_pass mqtt_cluster;
    }

    # Preserve the client's TLS session end-to-end. FluxMQ terminates mTLS,
    # verifies the client certificate, and separately sends the MQTT username
    # and password to the configured Atom authentication bridge.
    server {
        listen ${MG_NGINX_MQTTS_PORT};
        listen [::]:${MG_NGINX_MQTTS_PORT};

        proxy_pass mqtt_mtls_cluster;
    }

    server {
        listen ${MG_NGINX_MQTT_V5_PORT};
        listen [::]:${MG_NGINX_MQTT_V5_PORT};

        proxy_pass mqtt_v5_cluster;
    }

    # FluxMQ AMQP 0.9.1
    server {
        listen ${MG_NGINX_AMQP_PORT};
        listen [::]:${MG_NGINX_AMQP_PORT};

        proxy_pass fluxmq_amqp_cluster;
    }
}

error_log info.log info;
