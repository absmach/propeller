[package]
name = "hal-runner"
version = "0.6.2"
edition = "2021"

[[bin]]
name = "hal-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
wasmtime-wasi-http = "50.0.0"
elastic-tee-hal = { git = "https://github.com/elasticproject-eu/wasmhal", branch = "main", default-features = false, features = [
  "amd-sev",
  "intel-tdx",
] }
