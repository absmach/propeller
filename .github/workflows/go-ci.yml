name: Go Continuous Integration Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  go-lint-and-build:
    name: Go Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Go 1.27.4 rejects the LTO sections in wasmtime-go's prebuilt
          # libwasmtime.a, which breaks both lint and cgo builds. Pin until the
          # dependency ships an LTO-free library.
          go-version: 1.27.3
          cache-dependency-path: "go.sum"

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config ./.golangci.yaml

      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo_0.42.0_amd64.deb
          sudo dpkg -i tinygo_0.42.0_amd64.deb

      - name: Install wabt
        run: sudo apt-get install -y wabt

      # The amd-sev feature pulls az-snp-vtpm -> tss-esapi-sys, whose build
      # script needs the TPM2 TSS headers (tss2-sys.pc) on the runner.
      - name: Install TPM2 TSS development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev libssl-dev pkg-config

      - name: Install wasmtools
        run: cargo install --locked wasm-tools

      - name: Add wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Build Artifacts
        run: make all -j $(nproc)
